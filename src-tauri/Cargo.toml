[package]
name = "virtual-autofisher"
version = "2.0.0"
edition = "2021"
description = "Virtual AutoFisher: automates the Virtual Fisher Discord bot"
publish = false

[lib]
name = "virtual_autofisher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "6"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
